<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>训练工坊 · 生图训练</title>
<style>
:root{--line:rgba(15,23,42,.12);--text:#0F172A;--dim:#55658A;--muted:#9AA6BF;--image:#C97B12;--ok:#0E9F6E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow:hidden;background:linear-gradient(180deg,#FAFBFD,#EEF2F8);color:var(--text);font-family:"Noto Sans SC","Microsoft YaHei UI",sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
.aura{position:fixed;border-radius:50%;pointer-events:none;filter:blur(40px);z-index:0}
.aura--a{width:620px;height:620px;left:-180px;top:-200px;background:radial-gradient(circle,rgba(240,179,90,.26),transparent 68%)}
.aura--b{width:660px;height:660px;right:-240px;bottom:-260px;background:radial-gradient(circle,rgba(90,209,165,.22),transparent 68%)}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:clamp(16px,2.4vh,34px) clamp(22px,4vw,64px)}
.top{display:flex;align-items:center;justify-content:space-between;height:56px;flex:0 0 auto}
.left{display:flex;align-items:center;gap:12px}
.back{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.7);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text)}
.back svg{width:19px;height:19px}
.brand{font-family:"Manrope","Segoe UI",sans-serif;font-weight:700;font-size:17px}
.brand span{font-family:inherit;font-weight:400;font-size:13.5px;color:var(--dim);margin-left:9px}
.chip{height:40px;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--dim);font-size:13.5px}
.body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;width:100%;max-width:1600px;margin:0 auto;padding-top:2px}
h1{font-size:clamp(34px,3.4vw,52px);font-weight:600;letter-spacing:-.02em;text-align:center}
.meta{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;font-size:14.5px;color:var(--dim)}
.meta b{color:var(--text);font-weight:600}

/* --- arch form (flux2 / krea2) --- */
.archbox{margin-top:2px;padding:10px 14px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.72);display:flex;flex-direction:column;gap:8px}
.archbox>.field{display:grid;grid-template-columns:180px 1fr;gap:10px;align-items:center;font-size:12.5px;color:var(--dim)}
.archbox input{height:34px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.86);padding:0 10px;font:inherit;color:var(--text);min-width:0}
.archbox .field.err input{border-color:#C0392B}
.archauto{font-size:13px;color:var(--dim);min-height:1.4em}.archbox .err{grid-column:2;color:#C0392B;font-size:12px;min-height:1em}
.archpaths{display:flex;flex-direction:column;gap:8px}
.archpaths[hidden]{display:none}

.bar{height:10px;border-radius:99px;background:rgba(15,23,42,.10);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--image);transition:width .2s linear}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;align-self:stretch}
.stats .k{font-size:13.5px}
.stats .v{font-size:clamp(23px,2.2vw,30px)}
.cell{border:1px solid var(--line);border-radius:13px;padding:10px 14px;background:rgba(255,255,255,.72)}
.k{font-size:12.5px;color:var(--dim)}
.v{font-family:"Manrope",sans-serif;font-size:20px;font-weight:600;margin-top:2px}
.v small{font-size:12.5px;color:var(--dim);font-weight:400}

.meters{margin-top:8px;display:flex;flex-direction:column;gap:6px;width:100%;align-self:stretch}
.meter{display:grid;grid-template-columns:44px 1fr 150px;gap:10px;align-items:center;font-size:12.5px}
.meter__bar{height:6px;border-radius:99px;background:rgba(15,23,42,.08);overflow:hidden}
.meter__bar>i{display:block;height:100%;width:0;transition:width .25s linear;background:#0E9F6E}
#ramBar{background:#5B7CFA}
#vramBar.is-hot,#ramBar.is-hot{background:#C0392B}
.meter__v{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}

.rounds{display:flex;flex-direction:column;gap:10px;max-height:42vh;overflow:auto;padding-right:4px}
.round{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.66);padding:12px 14px}
.round.is-chosen{border-color:rgba(14,159,110,.55);box-shadow:0 0 0 2px rgba(14,159,110,.15) inset}
.round__head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.round__t{font-size:15.5px;font-weight:600}
.round__lora{font-family:"Manrope",monospace;font-size:12.5px;color:var(--dim)}
.round__sp{flex:1}
.mini{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px}
.mini--ok{border-color:rgba(14,159,110,.45);background:rgba(14,159,110,.10);color:#0B7A54;font-weight:600}
.round__imgs{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.shot{width:132px}
.shot__img{height:132px;border-radius:12px;border:1px solid var(--line);background:
  radial-gradient(circle at 30% 30%,rgba(240,179,90,.55),transparent 60%),
  radial-gradient(circle at 70% 70%,rgba(122,167,255,.45),transparent 62%),
  linear-gradient(160deg,#ffffff,#eef2f8);background-size:cover;background-position:center;background-repeat:no-repeat}
.shot__cap{font-size:12px;color:var(--dim);margin-top:5px;font-family:"Manrope",sans-serif}
.log{height:86px;overflow:auto;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.7);padding:9px 13px;font-family:"Manrope",monospace;font-size:13px;line-height:1.85;color:var(--dim)}
.log b{color:var(--text)}
.done{border:1px solid rgba(14,159,110,.30);border-radius:16px;padding:14px 18px;background:rgba(14,159,110,.07)}

/* --- resume from LoRA --- */
.resume{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--dim)}
.resume select{min-width:280px;max-width:100%;height:36px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.82);padding:0 10px;font:inherit;color:var(--text)}
.resume button[disabled]{opacity:.45;cursor:not-allowed}

.done__t{font-size:17px;font-weight:600}
.lorolist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.lorow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:rgba(255,255,255,.7)}
.lorow.is-chosen{border-color:rgba(14,159,110,.55);background:rgba(14,159,110,.08)}
.lorow code{flex:1;min-width:260px;font-family:"Manrope",monospace;font-size:12.5px;word-break:break-all}
.foot{flex:0 0 auto;display:flex;justify-content:space-between;gap:12px;padding-top:10px}
.btn{height:48px;padding:0 24px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.8);font-size:15.5px;color:var(--text);text-decoration:none;display:inline-flex;align-items:center}
.btn--primary{background:#0F172A;color:#fff;border-color:#0F172A}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}

/* --- art polish (CSS only) --- */
.card,.cell,.panel,.row{transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease,background-color .22s ease}
.card:hover,.panel:hover,.row:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(15,23,42,.12);border-color:rgba(201,123,18,.34)}
.card::after,.panel::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.28),rgba(255,255,255,0) 42%,rgba(255,255,255,.16));opacity:.7}
h1,h2{letter-spacing:-.012em}
.cell .k{letter-spacing:.035em}
hr,.divider{background-image:linear-gradient(90deg,rgba(15,23,42,.02),rgba(15,23,42,.16),rgba(15,23,42,.02))}

/* --- training glow (wire adds body.training-glow) --- */
@media (prefers-reduced-motion: no-preference){
@keyframes ms-glow-flow{0%{background-position:0% 50%}100%{background-position:220% 50%}}
body.training-glow .top{background-image:linear-gradient(110deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));background-size:220% 100%;animation:ms-glow-flow 2.6s linear infinite}
body.training-glow .bar>i{background-image:linear-gradient(90deg,var(--image,var(--llm,#C97B12)),#F0C987,var(--image,var(--llm,#C97B12)),#FFF0CF,var(--image,var(--llm,#C97B12)));background-size:220% 100%;animation:ms-glow-flow 2.6s linear infinite}
body.training-glow .stats .cell{box-shadow:0 0 0 1px rgba(201,123,18,.28),0 10px 28px rgba(201,123,18,.12)}
body.training-glow .bar{box-shadow:0 0 0 1px rgba(201,123,18,.20),0 0 22px rgba(201,123,18,.18)}
}

/* --- environment panel --- */
#envPanel{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(15,23,42,.30);backdrop-filter:blur(8px)}
#envPanel[hidden]{display:none}
.envcard{width:min(560px,calc(100vw - 40px));max-height:min(70vh,520px);overflow:auto;border-radius:18px;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.75);box-shadow:0 24px 70px rgba(15,23,42,.28);padding:20px 22px 18px}
.envcard__head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
.envcard__head b{font-size:15px;letter-spacing:.02em}
#envClose{width:30px;height:30px;border-radius:9px;border:1px solid rgba(15,23,42,.14);background:rgba(255,255,255,.7);color:#334155;font-size:18px;line-height:1;cursor:pointer}
#envClose:hover{background:#F1F5F9}
#envBody{font:12.5px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;color:#334155;white-space:pre-wrap;word-break:break-word}
.chip[data-env]{cursor:pointer}


/* --- sample image lightbox --- */
.shot__img{cursor:zoom-in}
#msLightbox{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:4vw;background:rgba(15,23,42,.72);backdrop-filter:blur(8px)}
#msLightbox[hidden]{display:none}
#msLightboxImg{max-width:92vw;max-height:92vh;width:auto;height:auto;object-fit:contain;border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.5);background:#0F172A}
#msLightboxClose{position:absolute;top:18px;right:22px;width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.30);background:rgba(255,255,255,.12);color:#fff;font-size:24px;line-height:1;cursor:pointer}
#msLightboxClose:hover{background:rgba(255,255,255,.22)}

</style>
</head>
<body>
<div class="aura aura--a"></div><div class="aura aura--b"></div>
<div class="wrap">
  <div class="top">
    <div class="left">
      <a class="back" href="image-params.html" aria-label="返回参数页">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4L5 10l6 6M5 10h11"/></svg>
      </a>
      <div class="brand">生图 LoRA <span>第 4 步 / 共 4 步 · 训练</span></div>
    </div>
    <div><button class="chip" type="button" data-env="1">环境</button></div>
  </div>

  <div class="body">
    <h1 id="title">正在训练</h1>
    <div class="meta">
      <span>底模 <b id="mName">—</b></span>
      <span>图片 <b id="dName">—</b></span>
      <span>共 <b>未填</b> 步 · 每 200 步出图并存一份 LoRA（只留最近 5 份）</span>
    </div>

    <div class="archbox" id="archBox">
      <div id="archError"></div>
    </div>

    <div class="bar"><i id="bar"></i></div>

    <div class="meters">
      <div class="meter"><span class="meter__k">显存</span>
        <div class="meter__bar"><i id="vramBar"></i></div>
        <span class="meter__v" id="vramUsed">—</span></div>
      <div class="meter"><span class="meter__k">内存</span>
        <div class="meter__bar"><i id="ramBar"></i></div>
        <span class="meter__v" id="ramUsed">—</span></div>
    </div>

    <div class="stats">
      <div class="cell"><div class="k">进度</div><div class="v" id="step">0 <small>/ —</small></div></div>
      <div class="cell"><div class="k">速度</div><div class="v" id="sp">— <small>s/it</small></div></div>
      <div class="cell"><div class="k">已出组</div><div class="v" id="shots">0 <small>组（显示最近 5 组）</small></div></div>
      <div class="cell"><div class="k">用时</div><div class="v" id="time">0:00</div></div>
    </div>

    <div class="rounds" id="rounds"></div>
    <div class="log" id="log"></div>

    <div class="done" id="done" hidden>
      <div class="done__t">训练结束 · 最近 5 份 LoRA（挑一份用）</div>
      <div class="lorolist" id="lorolist"></div>
    </div>
      <div class="resume" id="resumeBox">
        <select id="resumeFrom"><option value="">选择要续训的 LoRA…</option></select>
        <button id="resumeBtn" type="button" class="chip" disabled>从这份 LoRA 继续训</button>
        <span id="resumeMsg"></span>
      </div>
  </div>

  <div class="foot">
    <button class="btn" id="cancel" type="button">取消训练</button>
    <a class="btn btn--primary" id="finish" href="index.html" aria-disabled="true">完成</a>
  </div>
</div>
<script>
(function(){
  var qs=new URLSearchParams(location.search);
  var model=qs.get("model")||"", data=qs.get("data")||"";
  var prompts=(qs.get("prompts")||"").split("\n").filter(Boolean);
  document.getElementById("mName").textContent=model?model.split(/[\\/]/).filter(Boolean).pop():"—";
  document.getElementById("dName").textContent=data?data.split(/[\\/]/).filter(Boolean).pop():"—";

  var TOTAL=3000, /* file:// 离线模拟常量 */ EVERY=200, KEEP=5, STEP_PER_TICK=25, TICK=110;
  var title=document.getElementById("title"), bar=document.getElementById("bar"),
      stepEl=document.getElementById("step"), spEl=document.getElementById("sp"),
      shotsEl=document.getElementById("shots"), timeEl=document.getElementById("time"),
      roundsEl=document.getElementById("rounds"), logEl=document.getElementById("log"),
      doneEl=document.getElementById("done"), lorolist=document.getElementById("lorolist"),
      cancel=document.getElementById("cancel"), finish=document.getElementById("finish");
  var step=0, t0=Date.now(), timer=null, finished=false, groups=0, lastSampled=0;
  var history=[], chosen=null, starred=new Set();
  var OUT="E:\\视频\\modelsmith\\_runs\\ui-diffsynth-20261022-180000";

  function mmss(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
  function loraPath(at){ return OUT+"\\step-"+String(at).padStart(4,"0")+".safetensors"; }
  function log(t){ var d=document.createElement("div"); d.innerHTML=t; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }

  function addRound(at, first){
    groups++;
    shotsEl.innerHTML=groups+" <small>组（显示最近 5 组）</small>";
    var set=prompts.slice(0,4); if(!set.length) set=["(未设置提示词)"];
    var div=document.createElement("div");
    div.className="round"; div.dataset.step=at;
    var label=first?"首图（训练前）":("第 "+Math.ceil(at/EVERY)+" 组 · step "+at);
    div.innerHTML='<div class="round__head">'
      + '<span class="round__t">'+label+'</span>'
      + '<span class="round__lora">LoRA: '+(first?"(未训练)":"step-"+String(at).padStart(4,"0")+".safetensors")+'</span>'
      + '<span class="round__sp"></span>'
      + (first?"":'<button class="mini" data-act="star" type="button">☆ 候选</button>'
              +'<button class="mini" data-act="pick" type="button">选这份</button>'
              +'<button class="mini mini--ok" data-act="stop" type="button">这轮达标，停训保留</button>')
      + '</div>'
      + '<div class="round__imgs">'+set.map(function(p,i){
          return '<div class="shot"><div class="shot__img" tabindex="0"></div><div class="shot__cap">#'+(i+1)+' '+p.slice(0,18)+'</div></div>';
        }).join('')+'</div>';

    div.querySelectorAll('[data-act]').forEach(function(btn){
      btn.addEventListener("click",function(){
        var act=btn.getAttribute("data-act");
        if(act==="pick"){ choose(div,at); }
        else if(act==="star"){
          if(starred.has(at)){ starred.delete(at); btn.textContent="☆ 候选"; btn.style.color=""; }
          else { starred.add(at); btn.textContent="★ 已标候选"; btn.style.color="#B4710A"; }
          log((starred.has(at)?"<b>已标候选</b> step ":"<b>取消候选</b> step ")+at);
        }
        else { choose(div,at); stopTraining("已按你选的这一轮停训（step "+at+"）"); }
      });
    });
    roundsEl.appendChild(div);
    roundsEl.scrollTop = roundsEl.scrollHeight;
    history.push(at);
    // 只显示最近 5 组（含首图那组）
    var all=[].slice.call(roundsEl.children);
    while(all.length>KEEP){ roundsEl.removeChild(all.shift()); }
    log((first?"<b>首图</b>":"<b>采样</b> step "+at)+"：出 "+set.length+" 张"+(first?"":"（已存 LoRA step-"+String(at).padStart(4,"0")+"）"));
  }

  function choose(div,at){
    chosen=at;
    [].slice.call(roundsEl.children).forEach(function(el){ el.classList.toggle("is-chosen", el===div); });
    log("<b>已选中</b> step "+at+" 的 LoRA");
  }

  function tick(){
    if(finished) return;
    step+=STEP_PER_TICK;
    if(step>TOTAL) step=TOTAL;
    stepEl.innerHTML=step+" <small>/ "+TOTAL+"</small>";
    bar.style.width=(step/TOTAL*100)+"%";
    spEl.innerHTML=(3.6+Math.random()*0.5).toFixed(2)+" <small>s/it</small>";
    timeEl.textContent=mmss((Date.now()-t0)/1000);
    log("step "+step+" / "+TOTAL+" · "+spEl.textContent.trim());
    var at=Math.floor(step/EVERY)*EVERY;
    if(at>0 && at!==lastSampled){ lastSampled=at; addRound(at,false); }
    if(step>=TOTAL){ finishRun(); return; }
    timer=setTimeout(tick,TICK);
  }

  function finishRun(){
    finished=true; clearTimeout(timer);
    title.textContent="训练完成";
    showDone();
    finish.removeAttribute("aria-disabled");
    cancel.setAttribute("aria-disabled","true");
    log("<b>训练完成</b>：epoch-0.safetensors 已写入 "+OUT);
  }
  function stopTraining(reason){
    if(finished) return;
    finished=true; clearTimeout(timer);
    title.textContent="已停训";
    log("<b>已停训</b>："+reason+"；后续 200 步采样已跳过。");
    showDone();
    finish.removeAttribute("aria-disabled");
    cancel.setAttribute("aria-disabled","true");
  }
  function showDone(){
    doneEl.hidden=false;
    var keep=history.filter(function(a){ return a>0; }).slice(-KEEP);
    var bag={};
    keep.forEach(function(a){ bag[a]=true; });
    starred.forEach(function(a){ bag[a]=true; });
    var list=Object.keys(bag).map(Number).sort(function(x,y){ return x-y; });
    lorolist.innerHTML="";
    if(!list.length){ lorolist.innerHTML='<div class="lorow"><code>（还没有采样点，只有 epoch-0.safetensors）</code></div>'; }
    list.forEach(function(at){
      var p=loraPath(at);
      var row=document.createElement("div");
      row.className="lorow"+(chosen===at?" is-chosen":"");
      row.innerHTML='<code>'+(starred.has(at)?"★ ":"")+p+'</code>'
        + '<button class="mini" data-copy type="button">复制路径</button>'
        + '<button class="mini" type="button" data-choose>选这份</button>';
      row.querySelector('[data-copy]').addEventListener("click",function(ev){
        var t=p, b=ev.currentTarget, old=b.textContent;
        if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ b.textContent="已复制 ✓"; setTimeout(function(){b.textContent=old;},1200); }); }
        else { b.textContent="已复制 ✓"; setTimeout(function(){b.textContent=old;},1200); }
      });
      row.querySelector('[data-choose]').addEventListener("click",function(){
        chosen=at;
        [].slice.call(lorolist.children).forEach(function(el){ el.classList.toggle("is-chosen", el===row); });
        log("<b>最终选用</b> "+p);
      });
      lorolist.appendChild(row);
    });
    var ep=document.createElement("div");
    ep.className="lorow";
    ep.innerHTML='<code>'+OUT+'\\epoch-0.safetensors</code><span style="font-size:13px;color:var(--dim)">训练结束档</span>';
    lorolist.appendChild(ep);
  }

  cancel.addEventListener("click",function(){ if(!finished) stopTraining("你点了取消"); });

  log("<b>开始训练</b>："+TOTAL+" 步 · 每 "+EVERY+" 步出图并保存 LoRA · 只保留最近 "+KEEP+" 份");
  addRound(0,true);
  timer=setTimeout(tick,600);
})();
</script>


<div id="msLightbox" hidden>
  <button id="msLightboxClose" type="button" aria-label="关闭大图">×</button>
  <img id="msLightboxImg" alt="">
</div>

<script>
(function(){
  var lb=document.getElementById("msLightbox"),im=document.getElementById("msLightboxImg"),cl=document.getElementById("msLightboxClose");
  if(!lb||!im||!cl) return;
  function clear(){im.removeAttribute("src");lb.hidden=true;}
  function open(el){
    var bg=getComputedStyle(el).backgroundImage||"";
    var m=bg.match(/url\((['"]?)(.*?)\1\)/);
    if(!m||!m[2]||m[2]==="none") return;
    im.src=m[2]; lb.hidden=false;
  }
  document.addEventListener("click",function(e){
    var el=e.target.closest&&e.target.closest(".shot__img");
    if(el){ e.preventDefault(); e.stopPropagation(); open(el); return; }
    if(e.target===lb) clear();
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&!lb.hidden){clear();return;}
    if((e.key==="Enter"||e.key===" ")&&e.target.closest&&e.target.closest(".shot__img")){e.preventDefault();open(e.target.closest(".shot__img"));}
  });
  cl.addEventListener("click",function(e){e.stopPropagation();clear();});
  function tabs(){var a=document.querySelectorAll(".shot__img");for(var i=0;i<a.length;i++)a[i].setAttribute("tabindex","0");}
  tabs();
  if(window.MutationObserver){try{new MutationObserver(tabs).observe(document.body,{childList:true,subtree:true});}catch(e){}}
})();
</script>

<div id="envPanel" hidden>
  <div class="envcard" role="dialog" aria-modal="true" aria-labelledby="envTitle">
    <div class="envcard__head"><b id="envTitle">环境检测</b><button id="envClose" type="button" aria-label="关闭环境面板">×</button></div>
    <div id="envBody">核心未连接</div>
  </div>
</div>
<script>
(function(){var p=document.getElementById("envPanel"),b=document.getElementById("envBody"),c=document.getElementById("envClose");
function close(){if(p)p.hidden=true;}
var chips=document.querySelectorAll("[data-env], .chip");
for(var i=0;i<chips.length;i++){if(String(chips[i].textContent).trim()!=="环境")continue;chips[i].addEventListener("click",function(){if(p)p.hidden=false;});}
if(c)c.addEventListener("click",close);
document.addEventListener("keydown",function(e){if(e.key==="Escape")close();});
})();
</script>
